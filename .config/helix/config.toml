theme = "cyberpunk"

[editor]
auto-format = true
default-yank-register = "+"
mouse = true
true-color = true
undercurl = true
color-modes = true
bufferline = "multiple"
cursorline = true
idle-timeout = 50
completion-trigger-len = 1

[editor.inline-diagnostics]
cursor-line = "warning" # Show warning/error details on the active line
other-lines = "error"   # Show errors inline on all other lines

[editor.lsp]
display-messages = true
display-inlay-hints = true
display-signature-help-docs = true
snippets = true
goto-reference-include-declaration = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

[editor.indent-guides]
render = true
character = "▏"
skip-levels = 1

[editor.soft-wrap]
enable = true

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = ["diagnostics", "workspace-diagnostics"]
right = [
  "register",
  "selections",
  "position",
  "position-percentage",
  "file-encoding",
  "file-type",
]
separator = "│"

[keys.normal]
# Maps Ctrl-s to the typable command :w which is an alias for :write (save file)
C-s = ":w"
# Maps `ga` to show possible code actions
g = { a = "code_action" }

# Quick buffer navigation (Shift+H / Shift+L)
H = ":buffer-previous"
L = ":buffer-next"

# line-up
A-u = [
  "keep_primary_selection",
  "extend_line",
  "yank",
  "move_line_up",
  "open_above",
  "normal_mode",
  "replace_with_yanked",
  "move_line_down",
  "move_line_down",
  "extend_line",
  "delete_selection",
  "move_line_up",
  "move_line_up",
]
# line-down
A-d = [
  "keep_primary_selection",
  "extend_line",
  "delete_selection",
  "paste_after",
  "move_line_down",
]

# yazi explorer
C-e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# lazygit
C-g = [
  ":write-all",
  ":new",
  ":insert-output lazygit",
  ":buffer-close!",
  ":redraw",
  ":reload-all",
]

[keys.normal.space]
q = ":q"                              # quit
x = ":buffer-close"                   # close buffer
n = ":new"                            # new buffer
i = ":toggle lsp.display-inlay-hints" # toggle inlay hints
F = ":format"                         # manual format (keeps space+f for file_picker)

[keys.insert]
# Maps Alt-X to enter normal mode
"A-x" = "normal_mode"
# Maps `jk` to exit insert mode
j = { k = "normal_mode" }
